<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subway Runner Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      background: #0f172a; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    .game-container { position: relative; width: 360px; height: 600px; }
    canvas {
      background: #334155; border: 4px solid #38bdf8; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; height: 100%;
    }
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95); border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 15px; z-index: 10;
    }
    .hidden { display: none !important; }
    h1 { color: #38bdf8; font-size: 1.8rem; }
    .btn {
      background: #0284c7; color: white; border: none; padding: 10px 20px;
      border-radius: 8px; font-size: 1rem; cursor: pointer; transition: 0.2s; width: 80%;
    }
    .btn:hover { background: #0369a1; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    select {
      padding: 8px 15px; border-radius: 6px; border: none; font-size: 1rem;
      background: #1e293b; color: white; width: 80%; text-align: center;
    }
    .shop-items { display: flex; gap: 10px; margin-top: 10px; }
    .shop-card {
      background: #1e293b; padding: 10px; border-radius: 8px; text-align: center;
      border: 2px solid transparent; width: 90px;
    }
    .shop-card.selected { border-color: #38bdf8; }
    .color-preview { width: 30px; height: 30px; border-radius: 4px; margin: 5px auto; }
    .top-bar {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; font-weight: bold; z-index: 5;
    }
    .pause-btn {
      position: absolute; top: 10px; right: 10px; z-index: 5;
      background: #38bdf8; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="top-bar">
    <div>النقاط: <span id="score">0</span></div>
    <div>المعيار: <span id="totalCoins">0</span> 🪙</div>
  </div>

  <button class="pause-btn hidden" id="pauseBtn" onclick="togglePause()">⏸️</button>

  <canvas id="gameCanvas" width="360" height="600"></canvas>

  <!-- القائمة الرئيسية -->
  <div class="overlay" id="mainMenu">
    <h1>Subway Runner 🏃</h1>
    <label>اختر مستوى الصعوبة:</label>
    <select id="difficulty">
      <option value="easy">سهل (Easy)</option>
      <option value="medium" selected>متوسط (Medium)</option>
      <option value="hard">صعب (Hard)</option>
    </select>
    <button class="btn" onclick="startGame()">ابدأ اللعب 🎮</button>
    <button class="btn" onclick="openShop()">المتجر 🛒</button>
  </div>

  <!-- قائمة المتجر -->
  <div class="overlay hidden" id="shopMenu">
    <h1>المتجر 🛒</h1>
    <p>معك: <span id="shopCoins">0</span> 🪙</p>
    <div class="shop-items" id="shopList"></div>
    <button class="btn btn-danger" onclick="closeShop()">رجوع</button>
  </div>

  <!-- قائمة الإيقاف المؤقت -->
  <div class="overlay hidden" id="pauseMenu">
    <h1>موقوف مؤقتاً ⏸️</h1>
    <button class="btn" onclick="togglePause()">استكمال</button>
    <button class="btn btn-danger" onclick="resetToMenu()">القائمة الرئيسية</button>
  </div>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // حفظ واسترجاع العملات والشخصيات
  let totalCoins = parseInt(localStorage.getItem("totalCoins")) || 0;
  let skins = JSON.parse(localStorage.getItem("skins")) || [
    { id: 'blue', color: '#38bdf8', price: 0, owned: true },
    { id: 'green', color: '#22c55e', price: 50, owned: false },
    { id: 'purple', color: '#a855f7', price: 100, owned: false }
  ];
  let activeSkin = localStorage.getItem("activeSkin") || '#38bdf8';

  const lanes = [60, 180, 300];
  let currentLane = 1;
  let player = { x: lanes[1], y: 500, width: 40, height: 50, jumpY: 0, isJumping: false, jumpSpeed: 0 };
  let obstacles = [], coins = [], score = 0, speed = 5, frameCount = 0;
  let isPlaying = false, isPaused = false, animationId;

  const difficultySettings = {
    easy: { baseSpeed: 4, spawnRate: 80 },
    medium: { baseSpeed: 6, spawnRate: 60 },
    hard: { baseSpeed: 9, spawnRate: 40 }
  };

  function updateUI() {
    document.getElementById("totalCoins").textContent = totalCoins;
    document.getElementById("shopCoins").textContent = totalCoins;
    localStorage.setItem("totalCoins", totalCoins);
    localStorage.setItem("skins", JSON.stringify(skins));
    localStorage.setItem("activeSkin", activeSkin);
  }

  function startGame() {
    const diff = document.getElementById("difficulty").value;
    speed = difficultySettings[diff].baseSpeed;
    
    // إعادة تعيين المتغيرات
    obstacles = []; coins = []; score = 0; frameCount = 0; currentLane = 1;
    player.x = lanes[1]; player.jumpY = 0; player.isJumping = false;
    document.getElementById("score").textContent = "0";

    document.getElementById("mainMenu").classList.add("hidden");
    document.getElementById("pauseBtn").classList.remove("hidden");
    isPlaying = true; isPaused = false;
    gameLoop();
  }

  function togglePause() {
    if (!isPlaying) return;
    isPaused = !isPaused;
    document.getElementById("pauseMenu").classList.toggle("hidden", !isPaused);
    if (!isPaused) gameLoop();
  }

  function resetToMenu() {
    isPlaying = false; isPaused = false;
    cancelAnimationFrame(animationId);
    document.getElementById("pauseMenu").classList.add("hidden");
    document.getElementById("pauseBtn").classList.add("hidden");
    document.getElementById("mainMenu").classList.remove("hidden");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // المتجر
  function openShop() {
    document.getElementById("mainMenu").classList.add("hidden");
    document.getElementById("shopMenu").classList.remove("hidden");
    renderShop();
  }

  function closeShop() {
    document.getElementById("shopMenu").classList.add("hidden");
    document.getElementById("mainMenu").classList.remove("hidden");
  }

  function renderShop() {
    const list = document.getElementById("shopList");
    list.innerHTML = "";
    skins.forEach((skin, idx) => {
      const card = document.createElement("div");
      card.className = `shop-card ${activeSkin === skin.color ? 'selected' : ''}`;
      card.innerHTML = `
        <div class="color-preview" style="background:${skin.color}"></div>
        <div>${skin.owned ? (activeSkin === skin.color ? 'مفعل' : 'مملوك') : skin.price + ' 🪙'}</div>
      `;
      card.onclick = () => {
        if (skin.owned) {
          activeSkin = skin.color;
        } else if (totalCoins >= skin.price) {
          totalCoins -= skin.price;
          skin.owned = true;
          activeSkin = skin.color;
        }
        updateUI();
        renderShop();
      };
      list.appendChild(card);
    });
  }

  // التحكم بالأسهم
  document.addEventListener("keydown", (e) => {
    if (!isPlaying || isPaused) return;
    if (e.key === "ArrowLeft" && currentLane > 0) currentLane--;
    if (e.key === "ArrowRight" && currentLane < 2) currentLane++;
    if (e.key === "ArrowUp" && !player.isJumping) {
      player.isJumping = true; player.jumpSpeed = -12;
    }
  });

  function update() {
    player.x += (lanes[currentLane] - player.x) * 0.2;
    if (player.isJumping) {
      player.jumpY += player.jumpSpeed;
      player.jumpSpeed += 0.6;
      if (player.jumpY >= 0) { player.jumpY = 0; player.isJumping = false; }
    }

    const diff = document.getElementById("difficulty").value;
    frameCount++;
    if (frameCount % difficultySettings[diff].spawnRate === 0) {
      const lane = Math.floor(Math.random() * 3);
      if (Math.random() > 0.4) obstacles.push({ x: lanes[lane], y: -60, w: 50, h: 40 });
      else coins.push({ x: lanes[lane], y: -30, r: 12 });
    }

    // تحديث حركة ووقت العوائق
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let o = obstacles[i]; o.y += speed;
      if (Math.abs(o.x - player.x) < 30 && o.y + o.h > player.y + player.jumpY && o.y < player.y + player.jumpY + player.height) {
        if (player.jumpY > -20) {
          alert(`خسرت! جمعت ${score} نقطة.`);
          resetToMenu();
          return;
        }
      }
      if (o.y > canvas.height) obstacles.splice(i, 1);
    }

    // تحديث حركة العملات
    for (let i = coins.length - 1; i >= 0; i--) {
      let c = coins[i]; c.y += speed;
      if (Math.abs(c.x - player.x) < 25 && Math.abs(c.y - (player.y + player.jumpY)) < 30) {
        score += 10; totalCoins += 1;
        document.getElementById("score").textContent = score;
        updateUI();
        coins.splice(i, 1);
      } else if (c.y > canvas.height) coins.splice(i, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // خطوط الحارات
    ctx.strokeStyle = "#475569"; ctx.setLineDash([20, 20]);
    ctx.beginPath(); ctx.moveTo(120, 0); ctx.lineTo(120, canvas.height); ctx.moveTo(240, 0); ctx.lineTo(240, canvas.height); ctx.stroke(); ctx.setLineDash([]);

    // رسم العوائق
    ctx.fillStyle = "#ef4444";
    obstacles.forEach(o => ctx.fillRect(o.x - o.w / 2, o.y, o.w, o.h));

    // رسم العملات
    ctx.fillStyle = "#eab308";
    coins.forEach(c => { ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill(); });

    // رسم اللاعب بالشكل المختار
    ctx.fillStyle = activeSkin;
    ctx.fillRect(player.x - player.width / 2, player.y + player.jumpY, player.width, player.height);
  }

  function gameLoop() {
    if (isPlaying && !isPaused) {
      update(); draw();
      animationId = requestAnimationFrame(gameLoop);
    }
  }

  updateUI();
</script>
</body>
</html>
