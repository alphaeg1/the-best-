<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extreme Subway Runner 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      background: #020617; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    .game-container { position: relative; width: 380px; height: 620px; }
    canvas {
      background: #0f172a; border: 4px solid #f43f5e; border-radius: 12px;
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.3); width: 100%; height: 100%;
    }
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95); border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; z-index: 10; padding: 20px;
    }
    .hidden { display: none !important; }
    h1 { color: #f43f5e; font-size: 1.8rem; text-shadow: 0 0 10px rgba(244, 63, 94, 0.5); }
    .btn {
      background: #e11d48; color: white; border: none; padding: 10px 20px;
      border-radius: 8px; font-size: 1rem; cursor: pointer; transition: 0.2s; width: 85%;
      font-weight: bold;
    }
    .btn:hover { background: #be123c; }
    .btn-secondary { background: #0284c7; }
    .btn-secondary:hover { background: #0369a1; }
    select {
      padding: 8px 15px; border-radius: 6px; border: 1px solid #334155; font-size: 1rem;
      background: #1e293b; color: white; width: 85%; text-align: center;
    }
    .shop-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
      max-height: 380px; overflow-y: auto; width: 100%; padding: 5px;
    }
    .shop-card {
      background: #1e293b; padding: 10px; border-radius: 8px; text-align: center;
      border: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; gap: 5px; font-size: 0.85rem;
    }
    .shop-card.selected { border-color: #f43f5e; background: #291e3b; }
    .top-bar {
      position: absolute; top: 12px; left: 15px; right: 15px;
      display: flex; justify-content: space-between; font-weight: bold; z-index: 5; font-size: 1.1rem;
    }
    .pause-btn {
      position: absolute; top: 10px; right: 10px; z-index: 5;
      background: #f43f5e; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; color: white;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="top-bar">
    <div>النقاط: <span id="score" style="color:#f43f5e;">0</span></div>
    <div>العملات: <span id="totalCoins" style="color:#eab308;">0</span> 🪙</div>
  </div>

  <button class="pause-btn hidden" id="pauseBtn" onclick="togglePause()">⏸️</button>

  <canvas id="gameCanvas" width="380" height="620"></canvas>

  <!-- القائمة الرئيسية -->
  <div class="overlay" id="mainMenu">
    <h1>Extreme Runner 🔥</h1>
    <label>مستوى الصعوبة المميت:</label>
    <select id="difficulty">
      <option value="easy">صعب (Hard)</option>
      <option value="medium" selected>مستحيل (Nightmare)</option>

      <option value="hard">جحيم (Hell Mode)</option>
    </select>
    <button class="btn" onclick="startGame()">ابدأ التحدي 🔥</button>
    <button class="btn btn-secondary" onclick="openShop()">المتجر 🛒</button>
  </div>

  <!-- قائمة المتجر -->
  <div class="overlay hidden" id="shopMenu">
    <h1>متجر الأشكال 🛒</h1>
    <p>معك: <span id="shopCoins" style="color:#eab308;">0</span> 🪙</p>
    <div class="shop-grid" id="shopList"></div>
    <button class="btn btn-secondary" onclick="closeShop()">رجوع</button>
  </div>

  <!-- قائمة الإيقاف المؤقت -->
  <div class="overlay hidden" id="pauseMenu">
    <h1>موقوف مؤقتاً ⏸️</h1>
    <button class="btn" onclick="togglePause()">استكمال</button>
    <button class="btn btn-secondary" onclick="resetToMenu()">القائمة الرئيسية</button>
  </div>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // بيانات الشخصيات المتوفرة بالمتجر (أشكال وألوان مختلفة)
  const availableSkins = [
    { id: 1, name: 'مربع أزرق', shape: 'square', color: '#38bdf8', price: 0 },
    { id: 2, name: 'مربع أخضر', shape: 'square', color: '#22c55e', price: 30 },
    { id: 3, name: 'مربع ذهبي', shape: 'square', color: '#eab308', price: 60 },
    { id: 4, name: 'مستطيل بنفسجي', shape: 'rect', color: '#a855f7', price: 40 },
    { id: 5, name: 'مستطيل أحمر', shape: 'rect', color: '#ef4444', price: 70 },
    { id: 6, name: 'دائرة زرقاء', shape: 'circle', color: '#0ea5e9', price: 50 },
    { id: 7, name: 'دائرة برتقالي', shape: 'circle', color: '#f97316', price: 80 },
    { id: 8, name: 'مثلث وردي', shape: 'triangle', color: '#ec4899', price: 60 },
    { id: 9, name: 'مثلث ذهبي', shape: 'triangle', color: '#eab308', price: 100 }
  ];

  let totalCoins = parseInt(localStorage.getItem("totalCoins_v2")) || 0;
  let ownedSkinIds = JSON.parse(localStorage.getItem("ownedSkins_v2")) || [1];
  let selectedSkinId = parseInt(localStorage.getItem("selectedSkin_v2")) || 1;

  const lanes = [70, 190, 310];
  let currentLane = 1;
  let player = { x: lanes[1], y: 510, width: 40, height: 40, jumpY: 0, isJumping: false, jumpSpeed: 0 };
  let obstacles = [], coins = [], score = 0, speed = 8, frameCount = 0;
  let isPlaying = false, isPaused = false, animationId;

  // إعدادات الصعوبة العالية جداً
  const difficultySettings = {
    easy: { baseSpeed: 9, spawnRate: 35, speedInc: 0.002 },
    medium: { baseSpeed: 12, spawnRate: 25, speedInc: 0.004 },
    hard: { baseSpeed: 16, spawnRate: 18, speedInc: 0.007 }
  };

  function updateUI() {
    document.getElementById("totalCoins").textContent = totalCoins;
    document.getElementById("shopCoins").textContent = totalCoins;
    localStorage.setItem("totalCoins_v2", totalCoins);
    localStorage.setItem("ownedSkins_v2", JSON.stringify(ownedSkinIds));
    localStorage.setItem("selectedSkin_v2", selectedSkinId);
  }

  function startGame() {
    const diff = document.getElementById("difficulty").value;
    speed = difficultySettings[diff].baseSpeed;
    
    obstacles = []; coins = []; score = 0; frameCount = 0; currentLane = 1;
    player.x = lanes[1]; player.jumpY = 0; player.isJumping = false;
    document.getElementById("score").textContent = "0";

    document.getElementById("mainMenu").classList.add("hidden");
    document.getElementById("pauseBtn").classList.remove("hidden");
    isPlaying = true; isPaused = false;
    gameLoop();
  }

  function togglePause() {
    if (!isPlaying) return;
    isPaused = !isPaused;
    document.getElementById("pauseMenu").classList.toggle("hidden", !isPaused);
    if (!isPaused) gameLoop();
  }

  function resetToMenu() {
    isPlaying = false; isPaused = false;
    cancelAnimationFrame(animationId);
    document.getElementById("pauseMenu").classList.add("hidden");
    document.getElementById("pauseBtn").classList.add("hidden");
    document.getElementById("mainMenu").classList.remove("hidden");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function openShop() {
    document.getElementById("mainMenu").classList.add("hidden");
    document.getElementById("shopMenu").classList.remove("hidden");
    renderShop();
  }

  function closeShop() {
    document.getElementById("shopMenu").classList.add("hidden");
    document.getElementById("mainMenu").classList.remove("hidden");
  }

  function renderShop() {
    const list = document.getElementById("shopList");
    list.innerHTML = "";
    availableSkins.forEach(skin => {
      const isOwned = ownedSkinIds.includes(skin.id);
      const isSelected = selectedSkinId === skin.id;

      const card = document.createElement("div");
      card.className = `shop-card ${isSelected ? 'selected' : ''}`;
      
      // إعداد المعاينة البصرية للشكل
      let shapeSVG = `<div style="width:30px; height:30px; background:${skin.color}; `;
      if (skin.shape === 'rect') shapeSVG = `<div style="width:20px; height:35px; background:${skin.color}; `;
      if (skin.shape === 'circle') shapeSVG += `border-radius: 50%; `;
      if (skin.shape === 'triangle') shapeSVG = `<div style="width:0; height:0; border-left:15px solid transparent; border-right:15px solid transparent; border-bottom:30px solid ${skin.color}; `;
      shapeSVG += `"></div>`;

      card.innerHTML = `
        ${shapeSVG}
        <div style="font-weight:bold;">${skin.name}</div>
        <div style="color:${isOwned ? '#4ade80' : '#eab308'}">
          ${isOwned ? (isSelected ? 'مفعل' : 'اختيار') : skin.price + ' 🪙'}
        </div>
      `;

      card.onclick = () => {
        if (isOwned) {
          selectedSkinId = skin.id;
        } else if (totalCoins >= skin.price) {
          totalCoins -= skin.price;
          ownedSkinIds.push(skin.id);
          selectedSkinId = skin.id;
        }
        updateUI();
        renderShop();
      };
      list.appendChild(card);
    });
  }

  // تحكم بالكيبورد
  document.addEventListener("keydown", (e) => {
    if (!isPlaying || isPaused) return;
    if (e.key === "ArrowLeft" && currentLane > 0) currentLane--;
    if (e.key === "ArrowRight" && currentLane < 2) currentLane++;
    if (e.key === "ArrowUp" && !player.isJumping) {
      player.isJumping = true; player.jumpSpeed = -13;
    }
  });

  function update() {
    const diff = document.getElementById("difficulty").value;
    speed += difficultySettings[diff].speedInc; // تسارع سريع

    player.x += (lanes[currentLane] - player.x) * 0.25;
    if (player.isJumping) {
      player.jumpY += player.jumpSpeed;
      player.jumpSpeed += 0.75; // جاذبية أعلى لقفز أسرع وأصعب
      if (player.jumpY >= 0) { player.jumpY = 0; player.isJumping = false; }
    }

    frameCount++;
    if (frameCount % difficultySettings[diff].spawnRate === 0) {
      const lane = Math.floor(Math.random() * 3);
      if (Math.random() > 0.3) {
        obstacles.push({ x: lanes[lane], y: -80, w: 55, h: 45, depth: 20 });
      } else {
        coins.push({ x: lanes[lane], y: -30, r: 12 });
      }
    }

    // تحديث العوائق والتصادم
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let o = obstacles[i]; o.y += speed;

      // تصادم بدقيق جداً
      if (Math.abs(o.x - player.x) < 32 && o.y + o.h > player.y + player.jumpY && o.y < player.y + player.jumpY + player.height) {
        if (player.jumpY > -25) {
          alert(`خسرت! سكورك: ${score}`);
          resetToMenu();
          return;
        }
      }
      if (o.y > canvas.height) obstacles.splice(i, 1);
    }

    // تحديث العملات
    for (let i = coins.length - 1; i >= 0; i--) {
      let c = coins[i]; c.y += speed;
      if (Math.abs(c.x - player.x) < 25 && Math.abs(c.y - (player.y + player.jumpY)) < 30) {
        score += 15; totalCoins += 1;
        document.getElementById("score").textContent = score;
        updateUI();
        coins.splice(i, 1);
      } else if (c.y > canvas.height) coins.splice(i, 1);
    }
  }

  // رسم العائق 3D والنار
  function draw3DObstacleWithFire(o) {
    const fireHeight = Math.random() * 20 + 15;

    // 1. ألسنة النار من أعلى المربع
    ctx.fillStyle = "#ff4500";
    ctx.beginPath();
    ctx.moveTo(o.x - o.w / 2, o.y);
    ctx.lineTo(o.x - o.w / 4, o.y - fireHeight);
    ctx.lineTo(o.x, o.y - 5);
    ctx.lineTo(o.x + o.w / 4, o.y - fireHeight * 1.2);
    ctx.lineTo(o.x + o.w / 2, o.y);
    ctx.fill();

    ctx.fillStyle = "#ffcc00"; // قلب النار أصفر
    ctx.beginPath();
    ctx.moveTo(o.x - o.w / 3, o.y);
    ctx.lineTo(o.x, o.y - fireHeight * 0.7);
    ctx.lineTo(o.x + o.w / 3, o.y);
    ctx.fill();

    // 2. المربع الـ 3D (الوجه الأمامي والجانبي والعلوي)
    const d = o.depth;
    // الوجه الجانبي
    ctx.fillStyle = "#991b1b";
    ctx.beginPath();
    ctx.moveTo(o.x + o.w / 2, o.y);
    ctx.lineTo(o.x + o.w / 2 + d, o.y - d);
    ctx.lineTo(o.x + o.w / 2 + d, o.y + o.h - d);
    ctx.lineTo(o.x + o.w / 2, o.y + o.h);
    ctx.fill();

    // الوجه العلوي
    ctx.fillStyle = "#f87171";
    ctx.beginPath();
    ctx.moveTo(o.x - o.w / 2, o.y);
    ctx.lineTo(o.x - o.w / 2 + d, o.y - d);
    ctx.lineTo(o.x + o.w / 2 + d, o.y - d);
    ctx.lineTo(o.x + o.w / 2, o.y);
    ctx.fill();

    // الوجه الأمامي الرئيسي
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(o.x - o.w / 2, o.y, o.w, o.h);
    ctx.strokeStyle = "#450a0a";
    ctx.strokeRect(o.x - o.w / 2, o.y, o.w, o.h);
  }

  // رسم اللاعب حسب الشكل واللون المختار من المتجر
  function drawPlayer() {
    const skin = availableSkins.find(s => s.id === selectedSkinId) || availableSkins[0];
    const px = player.x;
    const py = player.y + player.jumpY;

    ctx.fillStyle = skin.color;
    ctx.shadowColor = skin.color;
    ctx.shadowBlur = 10;

    if (skin.shape === 'square') {
      ctx.fillRect(px - 20, py, 40, 40);
    } else if (skin.shape === 'rect') {
      ctx.fillRect(px - 15, py - 10, 30, 50);
    } else if (skin.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(px, py + 20, 20, 0, Math.PI * 2);
      ctx.fill();
    } else if (skin.shape === 'triangle') {
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px - 20, py + 40);
      ctx.lineTo(px + 20, py + 40);
      ctx.closePath();
      ctx.fill();
    }

    ctx.shadowBlur = 0; // إعادة تعيين الظل
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // رسم طريق الحارات
    ctx.strokeStyle = "#334155"; ctx.setLineDash([15, 15]);
    ctx.beginPath(); 
    ctx.moveTo(130, 0); ctx.lineTo(130, canvas.height); 
    ctx.moveTo(250, 0); ctx.lineTo(250, canvas.height); 
    ctx.stroke(); ctx.setLineDash([]);

    // رسم العوائق 3D والنار
    obstacles.forEach(o => draw3DObstacleWithFire(o));

    // رسم العملات
    ctx.fillStyle = "#eab308";
    coins.forEach(c => {
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill();
    });

    // رسم اللاعب
    drawPlayer();
  }

  function gameLoop() {
    if (isPlaying && !isPaused) {
      update(); draw();
      animationId = requestAnimationFrame(gameLoop);
    }
  }

  updateUI();
</script>
</body>
</html>
