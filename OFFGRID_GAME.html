<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كيمو ضد الرصاص - ALPHA Edition</title>
  <style>
    * { 
      box-sizing: border-box; margin: 0; padding: 0; 
      font-family: system-ui, sans-serif; 
      touch-action: none; 
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0984e3; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; height: 100vh; overflow: hidden;
    }
    .game-container { 
      position: relative; width: 100vw; max-width: 400px; height: 92vh; max-height: 720px; 
    }
    canvas {
      background: #0984e3; border: 4px solid #fff; border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; height: 100%; display: block;
    }
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, #74b9ff 0%, #0984e3 100%);
      border-radius: 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      z-index: 10; padding: 20px 15px;
    }
    .hidden { display: none !important; }
    
    /* تصميم شعار اللعبة من الصورة */
    .title-container {
      position: relative;
      text-align: center;
      margin-top: 10px;
    }
    .game-logo {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fdcb6e;
      text-shadow: 3px 3px 0px #d63031, -3px -3px 0px #d63031, 3px -3px 0px #d63031, -3px 3px 0px #d63031, 0px 5px 15px rgba(0,0,0,0.6);
      line-height: 1.2;
    }
    .game-subtitle {
      font-size: 2.6rem;
      font-weight: 900;
      color: #ff7675;
      text-shadow: 3px 3px 0px #2d3436, -3px -3px 0px #2d3436, 3px -3px 0px #2d3436, -3px 3px 0px #2d3436, 0px 5px 15px rgba(0,0,0,0.6);
    }
    
    /* عرض شخصية كيمو في الواجهة */
    .hero-avatar {
      width: 170px;
      height: 220px;
      background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==') center/contain no-repeat;
      filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.4));
    }

    .btn {
      background: #d63031; color: white; border: 3px solid #fff; padding: 14px 20px;
      border-radius: 12px; font-size: 1.2rem; cursor: pointer; transition: 0.2s; width: 90%; font-weight: bold;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .btn:active { transform: scale(0.95); background: #e17055; }
    .btn-secondary { background: #00b894; }
    
    select {
      padding: 12px 15px; border-radius: 10px; border: 2px solid #fff; font-size: 1rem;
      background: #2d3436; color: white; width: 90%; text-align: center; font-weight: bold;
    }
    
    .top-bar {
      position: absolute; top: 15px; left: 15px; right: 15px;
      display: flex; justify-content: space-between; font-weight: bold; z-index: 5; font-size: 1.1rem;
      background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 20px; backdrop-filter: blur(5px);
    }
    .pause-btn {
      position: absolute; top: 12px; right: 12px; z-index: 6;
      background: #d63031; border: 2px solid #fff; padding: 8px 16px; border-radius: 10px; cursor: pointer; color: white; font-weight: bold;
    }
  </style>
</head>
<body>

<div class="game-container" id="touchArea">
  <div class="top-bar">
    <div>النقاط: <span id="score" style="color:#fdcb6e;">0</span></div>
    <div>الرصيد: <span id="totalCoins" style="color:#ffeaa7;">0</span> 🪙</div>
  </div>

  <button class="pause-btn hidden" id="pauseBtn" onclick="togglePause()">⏸️</button>

  <canvas id="gameCanvas" width="380" height="620"></canvas>

  <!-- واجهة اللعبة الرئيسية المستوحاة من بوستر اللعبة -->
  <div class="overlay" id="mainMenu">
    <div class="title-container">
      <div style="font-size:0.8rem; letter-spacing:2px; font-weight:bold; color:#dfe6e9;">CEOSS PRESENTS</div>
      <div class="game-logo">كيمو</div>
      <div class="game-subtitle">ضد الرصاص</div>
    </div>
    
    <canvas id="menuCharCanvas" width="160" height="210"></canvas>
    
    <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:12px;">
      <select id="difficulty">
        <option value="easy">سهل (مبتدئ)</option>
        <option value="medium" selected>صعب (تحدي كيمو)</option>
        <option value="hard">مستحيل (مطر الرصاص)</option>
      </select>
      <button class="btn" onclick="startGame()">ابدأ اللعب الآن 🔥</button>
    </div>
  </div>

  <div class="overlay hidden" id="pauseMenu">
    <div class="game-logo" style="font-size: 3rem;">موقوف</div>
    <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:12px;">
      <button class="btn" onclick="togglePause()">استكمال</button>
      <button class="btn btn-secondary" onclick="resetToMenu()">القائمة الرئيسية</button>
    </div>
    <div></div>
  </div>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const menuCanvas = document.getElementById("menuCharCanvas");
  const menuCtx = menuCanvas.getContext("2d");

  // تحويل صورة كيمو إلى عنصر برجمي للرسم
  const heroImg = new Image();
  heroImg.src = 'https://i.ibb.co/3kWyNkJ/kimo-character.png'; // تم تجهيز رابط الصورة بدقة عالية

  // رسم الشخصية في القائمة الرئيسية بعد التحميل
  heroImg.onload = () => {
    drawMenuCharacter();
  };

  function drawMenuCharacter() {
    menuCtx.clearRect(0, 0, menuCanvas.width, menuCanvas.height);
    if (heroImg.complete && heroImg.naturalWidth !== 0) {
      menuCtx.drawImage(heroImg, 0, 0, menuCanvas.width, menuCanvas.height);
    } else {
      // رندر بديل في حالة انقطاع الشبكة
      drawFallbackHero(menuCtx, menuCanvas.width / 2, menuCanvas.height - 20, 1.2);
    }
  }

  let totalCoins = parseInt(localStorage.getItem("kimo_coins")) || 0;
  const lanes = [70, 190, 310];
  let currentLane = 1;
  let player = { x: lanes[1], y: 480, width: 60, height: 85, jumpY: 0, isJumping: false, jumpSpeed: 0 };
  let obstacles = [], coins = [], score = 0, speed = 8, frameCount = 0;
  let isPlaying = false, isPaused = false, animationId;

  const difficultySettings = {
    easy: { baseSpeed: 8, spawnRate: 35, speedInc: 0.002 },
    medium: { baseSpeed: 11, spawnRate: 25, speedInc: 0.004 },
    hard: { baseSpeed: 15, spawnRate: 18, speedInc: 0.007 }
  };

  function updateUI() {
    document.getElementById("totalCoins").textContent = totalCoins;
    document.getElementById("score").textContent = score;
    localStorage.setItem("kimo_coins", totalCoins);
  }

  function startGame() {
    const diff = document.getElementById("difficulty").value;
    speed = difficultySettings[diff].baseSpeed;
    
    obstacles = []; coins = []; score = 0; frameCount = 0; currentLane = 1;
    player.x = lanes[1]; player.jumpY = 0; player.isJumping = false;
    
    document.getElementById("mainMenu").classList.add("hidden");
    document.getElementById("pauseBtn").classList.remove("hidden");
    isPlaying = true; isPaused = false;
    gameLoop();
  }

  function togglePause() {
    if (!isPlaying) return;
    isPaused = !isPaused;
    document.getElementById("pauseMenu").classList.toggle("hidden", !isPaused);
    if (!isPaused) gameLoop();
  }

  function resetToMenu() {
    isPlaying = false; isPaused = false;
    cancelAnimationFrame(animationId);
    document.getElementById("pauseMenu").classList.add("hidden");
    document.getElementById("pauseBtn").classList.add("hidden");
    document.getElementById("mainMenu").classList.remove("hidden");
    drawMenuCharacter();
  }

  // دوال حركة كيمو باللمس
  function moveLeft() { if (isPlaying && !isPaused && currentLane > 0) currentLane--; }
  function moveRight() { if (isPlaying && !isPaused && currentLane < 2) currentLane++; }
  function jump() {
    if (isPlaying && !isPaused && !player.isJumping) {
      player.isJumping = true; player.jumpSpeed = -14;
    }
  }

  // نظام اللمس المطور للشاشات (Swipe)
  let startX = 0, startY = 0;
  const touchArea = document.getElementById("touchArea");

  touchArea.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  touchArea.addEventListener("touchend", (e) => {
    if (!startX || !startY) return;
    let diffX = e.changedTouches[0].clientX - startX;
    let diffY = e.changedTouches[0].clientY - startY;

    if (Math.abs(diffX) > Math.abs(diffY)) {
      if (diffX > 20) moveRight();
      else if (diffX < -20) moveLeft();
    } else {
      if (diffY < -20) jump();
    }
    startX = 0; startY = 0;
  }, { passive: true });

  function update() {
    const diff = document.getElementById("difficulty").value;
    speed += difficultySettings[diff].speedInc;

    player.x += (lanes[currentLane] - player.x) * 0.25;
    if (player.isJumping) {
      player.jumpY += player.jumpSpeed;
      player.jumpSpeed += 0.8;
      if (player.jumpY >= 0) { player.jumpY = 0; player.isJumping = false; }
    }

    frameCount++;
    if (frameCount % difficultySettings[diff].spawnRate === 0) {
      const lane = Math.floor(Math.random() * 3);
      if (Math.random() > 0.3) {
        obstacles.push({ x: lanes[lane], y: -80, w: 40, h: 50 });
      } else {
        coins.push({ x: lanes[lane], y: -30, r: 12 });
      }
    }

    // حركة الحواجز (الرصاص والجدران)
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let o = obstacles[i]; o.y += speed;

      // تصادم مع كيمو
      if (Math.abs(o.x - player.x) < 35 && o.y + o.h > player.y + player.jumpY && o.y < player.y + player.jumpY + player.height) {
        if (player.jumpY > -20) {
          alert(`اصطدمت بالرصاص! النقاط: ${score}`);
          resetToMenu();
          return;
        }
      }
      if (o.y > canvas.height) obstacles.splice(i, 1);
    }

    // جمع الذهب
    for (let i = coins.length - 1; i >= 0; i--) {
      let c = coins[i]; c.y += speed;
      if (Math.abs(c.x - player.x) < 30 && Math.abs(c.y - (player.y + player.jumpY)) < 40) {
        score += 20; totalCoins += 1;
        updateUI();
        coins.splice(i, 1);
      } else if (c.y > canvas.height) coins.splice(i, 1);
    }
  }

  // رسم شخصية كيمو
  function drawKimoPlayer() {
    const px = player.x - player.width / 2;
    const py = player.y + player.jumpY;

    if (heroImg.complete && heroImg.naturalWidth !== 0) {
      ctx.drawImage(heroImg, px, py, player.width, player.height);
    } else {
      drawFallbackHero(ctx, player.x, py + player.height, 0.5);
    }
  }

  // رسم بديل احترافي للشخصية بالوشاح الأحمر والقميص الأصفر
  function drawFallbackHero(targetCtx, x, y, scale) {
    targetCtx.save();
    targetCtx.translate(x, y);
    targetCtx.scale(scale, scale);

    // الوشاح الأحمر (الكاب)
    targetCtx.fillStyle = "#d63031";
    targetCtx.beginPath();
    targetCtx.moveTo(-20, -70); targetCtx.lineTo(-35, -10); targetCtx.lineTo(35, -10); targetCtx.lineTo(20, -70);
    targetCtx.fill();

    // الجسم والقميص الأصفر
    targetCtx.fillStyle = "#fdcb6e";
    targetCtx.fillRect(-15, -65, 30, 35);

    // البنطال الجينز
    targetCtx.fillStyle = "#2c3e50";
    targetCtx.fillRect(-13, -30, 11, 30);
    targetCtx.fillRect(2, -30, 11, 30);

    // الرأس والشعر الأسود
    targetCtx.fillStyle = "#ff7979";
    targetCtx.beginPath(); targetCtx.arc(0, -85, 18, 0, Math.PI * 2); targetCtx.fill();

    targetCtx.fillStyle = "#2d3436";
    targetCtx.beginPath(); targetCtx.arc(0, -92, 20, Math.PI, Math.PI * 2); targetCtx.fill();

    targetCtx.restore();
  }

  function draw() {
    // خلفية الطريق والأشعة الأزرق المشرق من البوستر
    ctx.fillStyle = "#0984e3";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // خطوط الممرات
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 4;
    ctx.setLineDash([20, 20]);
    ctx.beginPath(); 
    ctx.moveTo(130, 0); ctx.lineTo(130, canvas.height); 
    ctx.moveTo(250, 0); ctx.lineTo(250, canvas.height); 
    ctx.stroke(); ctx.setLineDash([]);

    // رسم الحواجز (الرصاص)
    obstacles.forEach(o => {
      ctx.fillStyle = "#d63031";
      ctx.beginPath();
      ctx.arc(o.x, o.y + 20, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffeaa7";
      ctx.fillRect(o.x - 10, o.y + 10, 20, 30);
    });

    // رسم الكوينز
    ctx.fillStyle = "#fdcb6e";
    ctx.strokeStyle = "#ffeaa7";
    ctx.lineWidth = 2;
    coins.forEach(c => { 
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });

    // رسم كيمو
    drawKimoPlayer();
  }

  function gameLoop() {
    if (isPlaying && !isPaused) {
      update(); draw();
      animationId = requestAnimationFrame(gameLoop);
    }
  }

  updateUI();
</script>
</body>
</html>
