<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subway Runner 2D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .score-board { font-size: 1.5rem; margin-bottom: 10px; font-weight: bold; color: #facc15; }
    canvas {
      background: #334155;
      border: 4px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .controls { margin-top: 10px; color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="score-board">النقاط: <span id="score">0</span></div>
  <canvas id="gameCanvas" width="360" height="600"></canvas>
  <div class="controls">الأسهم: يمين / شمال للتنقل | فوق للقفز</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const lanes = [60, 180, 300]; // 3 حارات
    let currentLane = 1; // الحارة اللي في النص

    let player = {
      x: lanes[currentLane],
      y: 500,
      width: 40,
      height: 50,
      jumpY: 0,
      isJumping: false,
      jumpSpeed: 0
    };

    let obstacles = [];
    let coins = [];
    let score = 0;
    let speed = 5;
    let frameCount = 0;
    let gameOver = false;

    // التحكم بالأسهم
    document.addEventListener("keydown", (e) => {
      if (gameOver) return;
      if (e.key === "ArrowLeft" && currentLane > 0) {
        currentLane--;
      } else if (e.key === "ArrowRight" && currentLane < 2) {
        currentLane++;
      } else if (e.key === "ArrowUp" && !player.isJumping) {
        player.isJumping = true;
        player.jumpSpeed = -12;
      }
    });

    function updatePlayer() {
      // تحريك سلس بين الحارات
      const targetX = lanes[currentLane];
      player.x += (targetX - player.x) * 0.2;

      // منطق القفز
      if (player.isJumping) {
        player.jumpY += player.jumpSpeed;
        player.jumpSpeed += 0.6; // جاذبية
        if (player.jumpY >= 0) {
          player.jumpY = 0;
          player.isJumping = false;
        }
      }
    }

    function spawnObjects() {
      frameCount++;
      if (frameCount % 60 === 0) {
        const lane = Math.floor(Math.random() * 3);
        const type = Math.random() > 0.4 ? 'obstacle' : 'coin';
        if (type === 'obstacle') {
          obstacles.push({ x: lanes[lane], y: -60, width: 50, height: 40 });
        } else {
          coins.push({ x: lanes[lane], y: -30, size: 15 });
        }
      }
    }

    function updateObjects() {
      // تحديث العوائق
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += speed;

        // التصادم مع العائق (لو مش قافز)
        if (
          Math.abs(obs.x - player.x) < 30 &&
          obs.y + obs.height > player.y + player.jumpY &&
          obs.y < player.y + player.jumpY + player.height
        ) {
          if (player.jumpY > -20) { // لو مش قافز فوق العائق بمسافة كافية
            gameOver = true;
          }
        }

        if (obs.y > canvas.height) obstacles.splice(i, 1);
      }

      // تحديث العملات
      for (let i = coins.length - 1; i >= 0; i--) {
        let coin = coins[i];
        coin.y += speed;

        // تجميع العملة
        if (
          Math.abs(coin.x - player.x) < 25 &&
          Math.abs(coin.y - (player.y + player.jumpY)) < 30
        ) {
          score += 10;
          scoreElement.textContent = score;
          coins.splice(i, 1);
        } else if (coin.y > canvas.height) {
          coins.splice(i, 1);
        }
      }

      // زيادة السرعة تدريجياً
      if (frameCount % 300 === 0) speed += 0.5;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // رسم الحارات
      ctx.strokeStyle = "#475569";
      ctx.setLineDash([20, 20]);
      ctx.beginPath();
      ctx.moveTo(120, 0); ctx.lineTo(120, canvas.height);
      ctx.moveTo(240, 0); ctx.lineTo(240, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // رسم العوائق
      ctx.fillStyle = "#ef4444";
      obstacles.forEach(obs => {
        ctx.fillRect(obs.x - obs.width / 2, obs.y, obs.width, obs.height);
      });

      // رسم العملات
      ctx.fillStyle = "#eab308";
      coins.forEach(coin => {
        ctx.beginPath();
        ctx.arc(coin.x, coin.y, coin.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // رسم اللاعب (مع حساب القفز)
      ctx.fillStyle = "#38bdf8";
      const drawY = player.y + player.jumpY;
      ctx.fillRect(player.x - player.width / 2, drawY, player.width, player.height);
    }

    function gameLoop() {
      if (!gameOver) {
        updatePlayer();
        spawnObjects();
        updateObjects();
        draw();
        requestAnimationFrame(gameLoop);
      } else {
        alert(`خسرت! سكورك النهائي: ${score}`);
        document.location.reload();
      }
    }

    gameLoop();
  </script>
</body>
</html>
