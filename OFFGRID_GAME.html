<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الثعبان</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 { margin-bottom: 10px; color: #38bdf8; }
    .score-board { font-size: 1.2rem; margin-bottom: 15px; }
    canvas {
      background: #1e293b;
      border: 4px solid #38bdf8;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .controls { margin-top: 15px; color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>

  <h1>لعبة الثعبان 🐍</h1>
  <div class="score-board">النقاط: <span id="score">0</span></div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="controls">استخدم أسهم الكيبورد للتحرك</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let dx = 1;
    let dy = 0;
    let food = { x: 5, y: 5 };
    let score = 0;
    let gameInterval;

    function gameLoop() {
      moveSnake();
      if (checkGameOver()) {
        alert(`جيم أوفر! مجموع نقاطك: ${score}`);
        resetGame();
        return;
      }
      clearCanvas();
      drawFood();
      drawSnake();
    }

    function clearCanvas() {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
      ctx.fillStyle = "#4ade80";
      snake.forEach((part, index) => {
        // رأس الثعبان بلون مختلف قليلاً
        if (index === 0) ctx.fillStyle = "#22c55e";
        else ctx.fillStyle = "#4ade80";
        ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
      });
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = score;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
    }

    function drawFood() {
      ctx.fillStyle = "#f43f5e";
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
    }

    function checkGameOver() {
      const head = snake[0];
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return true;
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) return true;
      }
      return false;
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      dx = 1;
      dy = 0;
      score = 0;
      scoreElement.textContent = score;
      generateFood();
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" && dy !== 1) { dx = 0; dy = -1; }
      if (e.key === "ArrowDown" && dy !== -1) { dx = 0; dy = 1; }
      if (e.key === "ArrowLeft" && dx !== 1) { dx = -1; dy = 0; }
      if (e.key === "ArrowRight" && dx !== -1) { dx = 1; dy = 0; }
    });

    generateFood();
    setInterval(gameLoop, 100);
  </script>
</body>
</html>
