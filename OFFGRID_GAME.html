<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ALPHA - ضد الرصاص</title>
  <style>
    * { 
      box-sizing: border-box; margin: 0; padding: 0; 
      font-family: system-ui, -apple-system, sans-serif; 
      touch-action: none; 
      user-select: none; -webkit-user-select: none;
    }
    body {
      background: #0f172a; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; height: 100vh; overflow: hidden;
    }
    .game-container { 
      position: relative; width: 100vw; max-width: 400px; height: 92vh; max-height: 720px; 
    }
    canvas {
      background: #1e293b; border: 3px solid rgba(255,255,255,0.2); border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6); width: 100%; height: 100%; display: block;
    }
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      border-radius: 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      z-index: 10; padding: 20px 15px;
    }
    .hidden { display: none !important; }
    
    .title-container { text-align: center; margin-top: 5px; }
    .game-logo {
      font-size: 2.8rem; font-weight: 900; color: #f59e0b; letter-spacing: 2px;
      text-shadow: 3px 3px 0px #b45309, -2px -2px 0px #b45309, 0px 8px 20px rgba(0,0,0,0.7);
    }
    .game-subtitle {
      font-size: 2.2rem; font-weight: 900; color: #ef4444; margin-top: -5px;
      text-shadow: 2px 2px 0px #7f1d1d, 0px 5px 15px rgba(0,0,0,0.5);
    }

    .btn {
      background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: 2px solid rgba(255,255,255,0.4); padding: 14px 20px;
      border-radius: 14px; font-size: 1.1rem; cursor: pointer; transition: 0.2s; width: 90%; font-weight: bold;
      box-shadow: 0 8px 20px rgba(239,68,68,0.4); text-align: center;
    }
    .btn:active { transform: scale(0.96); }
    .btn-secondary { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 20px rgba(16,185,129,0.3); }
    .btn-shop { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; box-shadow: 0 8px 20px rgba(245,158,11,0.3); }

    /* متجر الشخصيات بالدين */
    .shop-container {
      width: 100%; height: 62%; background: rgba(15, 23, 42, 0.6); border-radius: 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; padding: 10px;
      overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
    }
    .skin-card {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; background: rgba(255,255,255,0.05); padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    }
    .skin-btn {
      padding: 8px 14px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    
    .top-bar {
      position: absolute; top: 12px; left: 15px; right: 15px;
      display: flex; justify-content: space-between; font-weight: bold; z-index: 5; font-size: 0.95rem;
      background: rgba(15, 23, 42, 0.75); padding: 8px 15px; border-radius: 20px; backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .pause-btn {
      position: absolute; top: 10px; right: 10px; z-index: 6;
      background: #ef4444; border: 2px solid #fff; padding: 6px 12px; border-radius: 10px; cursor: pointer; color: white; font-weight: bold;
    }
    .debt-badge { color: #f87171; font-size: 0.8rem; display: block; }
  </style>
</head>
<body>

<div class="game-container" id="touchArea">
  <div class="top-bar">
    <div>النقاط: <span id="score" style="color:#f59e0b;">0</span></div>
    <div>الرصيد: <span id="totalCoins" style="color:#fbbf24;">0</span> 🪙</div>
  </div>

  <button class="pause-btn hidden" id="pauseBtn" onclick="togglePause()">⏸️</button>

  <canvas id="gameCanvas" width="380" height="620"></canvas>

  <!-- القائمة الرئيسية -->
  <div class="overlay" id="mainMenu">
    <div class="title-container">
      <div style="font-size:0.75rem; letter-spacing:3px; font-weight:bold; color:#94a3b8;">ALPHA AGENCY PRESENTS</div>
      <div class="game-logo">ALPHA</div>
      <div class="game-subtitle">ضد الرصاص</div>
    </div>
    
    <canvas id="menuCharCanvas" width="180" height="230"></canvas>
    
    <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:10px;">
      <button class="btn" onclick="startGame()">ابدأ الجري 🔥</button>
      <button class="btn btn-shop" onclick="openShop()">متجر الشخصيات 🛒</button>
    </div>
  </div>

  <!-- متجر ALPHA بالدين -->
  <div class="overlay hidden" id="shopMenu">
    <div style="text-align:center;">
      <div class="game-logo" style="font-size: 1.8rem;">متجر ALPHA 🛒</div>
      <div style="font-size: 0.85rem; color: #cbd5e1;">يمكنك الشراء الآن والسداد لاحقاً من الأرباح!</div>
    </div>
    
    <div class="shop-container" id="shopItems"></div>
    <button class="btn btn-secondary" onclick="closeShop()">الرجوع للقائمة 🔙</button>
  </div>

  <!-- قائمة الإيقاف المؤقت -->
  <div class="overlay hidden" id="pauseMenu">
    <div class="game-logo" style="font-size: 2.5rem;">موقوف</div>
    <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:12px;">
      <button class="btn" onclick="togglePause()">استكمال</button>
      <button class="btn btn-secondary" onclick="resetToMenu()">القائمة الرئيسية</button>
    </div>
    <div></div>
  </div>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const menuCanvas = document.getElementById("menuCharCanvas");
  const menuCtx = menuCanvas.getContext("2d");

  // تشكيلة شخصيات ALPHA
  const skins = [
    { id: 'classic', name: 'ALPHA الأصلي', price: 0, cape: '#dc2626', capeDark: '#991b1b', shirt: '#f59e0b', pants: '#1e293b', skinTone: '#ffb703' },
    { id: 'tactical', name: 'ALPHA التكتيكي', price: 80, cape: '#059669', capeDark: '#047857', shirt: '#334155', pants: '#0f172a', skinTone: '#ffb703' },
    { id: 'gold', name: 'ALPHA الذهبي', price: 150, cape: '#d97706', capeDark: '#b45309', shirt: '#fbbf24', pants: '#78350f', skinTone: '#ffe3a8' },
    { id: 'cyber', name: 'ALPHA السايبر', price: 250, cape: '#06b6d4', capeDark: '#0891b2', shirt: '#7c3aed', pants: '#4c1d95', skinTone: '#a5f3fc' },
    { id: 'shadow', name: 'ALPHA الظل', price: 400, cape: '#475569', capeDark: '#1e293b', shirt: '#0f172a', pants: '#020617', skinTone: '#e2e8f0' }
  ];

  let totalCoins = parseInt(localStorage.getItem("alpha_coins")) || 0; // الرصيد يمكن أن يصبح بالسالب (ديون)
  let unlockedSkins = JSON.parse(localStorage.getItem("alpha_skins")) || ['classic'];
  let currentSkinId = localStorage.getItem("alpha_active_skin") || 'classic';

  const lanes = [70, 190, 310];
  let currentLane = 1;
  let player = { x: lanes[1], y: 470, jumpY: 0, isJumping: false, jumpSpeed: 0 };
  let obstacles = [], coins = [], score = 0, speed = 9, frameCount = 0;
  let isPlaying = false, isPaused = false, animationId;
  let runCycle = 0;

  function getActiveSkin() {
    return skins.find(s => s.id === currentSkinId) || skins[0];
  }

  function updateUI() {
    const coinEl = document.getElementById("totalCoins");
    if (totalCoins < 0) {
      coinEl.innerHTML = `<span style="color:#f87171;">${totalCoins} (دين)</span>`;
    } else {
      coinEl.textContent = totalCoins;
    }
    document.getElementById("score").textContent = score;
    localStorage.setItem("alpha_coins", totalCoins);
    localStorage.setItem("alpha_skins", JSON.stringify(unlockedSkins));
    localStorage.setItem("alpha_active_skin", currentSkinId);
  }

  // 1. رسم شخصية ALPHA الواقعية في الواجهة الرئيسية (من الأمام - تفاصيل مجسمة)
  function drawRealisticFrontAlpha(targetCtx, x, y, scale = 1, skin) {
    targetCtx.save();
    targetCtx.translate(x, y);
    targetCtx.scale(scale, scale);

    // الوشاح الخلفي
    targetCtx.fillStyle = skin.capeDark;
    targetCtx.beginPath();
    targetCtx.moveTo(-22, -85); targetCtx.lineTo(-40, 20); targetCtx.lineTo(40, 20); targetCtx.lineTo(22, -85);
    targetCtx.fill();

    // السروال الواقعي بمفاصل الركبة
    targetCtx.fillStyle = skin.pants;
    targetCtx.beginPath();
    targetCtx.roundRect(-16, -35, 14, 45, 4);
    targetCtx.roundRect(2, -35, 14, 45, 4);
    targetCtx.fill();

    // قميص ALPHA الرياضي العريض (أكتاف رياضية)
    let shirtGrad = targetCtx.createLinearGradient(0, -90, 0, -30);
    shirtGrad.addColorStop(0, skin.shirt);
    shirtGrad.addColorStop(1, '#d97706');
    targetCtx.fillStyle = shirtGrad;
    targetCtx.beginPath();
    targetCtx.roundRect(-20, -90, 40, 58, 8);
    targetCtx.fill();

    // الوشاح حول العنق
    targetCtx.fillStyle = skin.cape;
    targetCtx.beginPath();
    targetCtx.ellipse(0, -88, 22, 10, 0, 0, Math.PI * 2);
    targetCtx.fill();

    // الرأس وتفاصيل الوجه الفائقة
    targetCtx.fillStyle = skin.skinTone;
    targetCtx.beginPath();
    targetCtx.arc(0, -108, 18, 0, Math.PI * 2);
    targetCtx.fill();

    // الشعر والتسريحة الحديثة
    targetCtx.fillStyle = "#0f172a";
    targetCtx.beginPath();
    targetCtx.arc(0, -114, 19, Math.PI * 0.8, Math.PI * 2.2);
    targetCtx.fill();
    // خصل شعر أمامية
    targetCtx.beginPath();
    targetCtx.moveTo(-18, -112); targetCtx.lineTo(-5, -100); targetCtx.lineTo(2, -114);
    targetCtx.lineTo(12, -98); targetCtx.lineTo(18, -112);
    targetCtx.fill();

    // العيون النسرية
    targetCtx.fillStyle = "#0f172a";
    targetCtx.fillRect(-7, -108, 4, 3);
    targetCtx.fillRect(3, -108, 4, 3);

    targetCtx.restore();
  }

  // 2. رسم شخصية ALPHA الواقعية أثناء الجري 3D (من الخلف المنظوري مع الحركة والتظليل)
  function drawRealisticRunningAlpha3D(targetCtx, x, y, animFrame, isJumping, skin) {
    targetCtx.save();
    targetCtx.translate(x, y);

    const legMove = isJumping ? 0 : Math.sin(animFrame * 0.35) * 16;
    const capeWave = Math.sin(animFrame * 0.45) * 14;

    // ظل البطل الديناميكي على الطريق
    targetCtx.fillStyle = "rgba(0,0,0,0.35)";
    targetCtx.beginPath();
    targetCtx.ellipse(0, 15, 26, 9, 0, 0, Math.PI * 2);
    targetCtx.fill();

    // الأرجل المجسمة ببنطال رياضي ومحاكاة خطوات الجري
    targetCtx.fillStyle = skin.pants;
    // رجل يسرى
    targetCtx.beginPath();
    targetCtx.roundRect(-16, -25 + legMove, 13, 38, 4);
    targetCtx.fill();
    // رجل يمنى
    targetCtx.beginPath();
    targetCtx.roundRect(3, -25 - legMove, 13, 38, 4);
    targetCtx.fill();

    // الحذاء التكتيكي
    targetCtx.fillStyle = "#020617";
    targetCtx.fillRect(-16, 10 + legMove, 13, 8);
    targetCtx.fillRect(3, 10 - legMove, 13, 8);

    // ظهر القميص الرياضي العريض (نسب واقعية للأكتاف)
    targetCtx.fillStyle = skin.shirt;
    targetCtx.beginPath();
    targetCtx.roundRect(-22, -75, 44, 52, 6);
    targetCtx.fill();

    // تموج الوشاح 3D بالطبقات والتظليل المتدرج
    let capeGrad = targetCtx.createLinearGradient(0, -75, 0, 30);
    capeGrad.addColorStop(0, skin.cape);
    capeGrad.addColorStop(1, skin.capeDark);
    targetCtx.fillStyle = capeGrad;
    
    targetCtx.beginPath();
    targetCtx.moveTo(-20, -75);
    targetCtx.quadraticCurveTo(-32 - capeWave, -30, -22 - capeWave, 25);
    targetCtx.quadraticCurveTo(0, 10, 22 + capeWave, 25);
    targetCtx.quadraticCurveTo(32 + capeWave, -30, 20, -75);
    targetCtx.fill();

    // خلفية الرأس والشعر من الخلف
    targetCtx.fillStyle = skin.skinTone;
    targetCtx.beginPath();
    targetCtx.arc(0, -88, 16, 0, Math.PI * 2);
    targetCtx.fill();

    targetCtx.fillStyle = "#0f172a";
    targetCtx.beginPath();
    targetCtx.arc(0, -91, 17, 0, Math.PI * 2);
    targetCtx.fill();

    targetCtx.restore();
  }

  function renderMenuHero() {
    menuCtx.clearRect(0, 0, menuCanvas.width, menuCanvas.height);
    drawRealisticFrontAlpha(menuCtx, menuCanvas.width / 2, 185, 1.25, getActiveSkin());
    if (!isPlaying) requestAnimationFrame(renderMenuHero);
  }

  function openShop() {
    document.getElementById("mainMenu").classList.add("hidden");
    document.getElementById("shopMenu").classList.remove("hidden");
    renderShopItems();
  }

  function closeShop() {
    document.getElementById("shopMenu").classList.add("hidden");
    document.getElementById("mainMenu").classList.remove("hidden");
    renderMenuHero();
  }

  function renderShopItems() {
    const container = document.getElementById("shopItems");
    container.innerHTML = '';

    skins.forEach(skin => {
      const isUnlocked = unlockedSkins.includes(skin.id);
      const isActive = currentSkinId === skin.id;

      let btnHTML = '';
      if (isActive) {
        btnHTML = `<button class="skin-btn" style="background:#10b981; color:#fff;" disabled>مفعل</button>`;
      } else if (isUnlocked) {
        btnHTML = `<button class="skin-btn" style="background:#f59e0b; color:#fff;" onclick="selectSkin('${skin.id}')">اركتدائه</button>`;
      } else {
        // زر الشراء بالدين
        btnHTML = `
          <button class="skin-btn" style="background:#ef4444; color:#fff;" onclick="buySkinWithDebt('${skin.id}', ${skin.price})">
            شراء بالدَّيْن 💳 (${skin.price} 🪙)
          </button>`;
      }

      container.innerHTML += `
        <div class="skin-card">
          <div>
            <div style="font-weight:bold; font-size:1.05rem;">${skin.name}</div>
            <span style="font-size:0.75rem; color:#94a3b8;">السعر الأصلي: ${skin.price} عملة</span>
          </div>
          ${btnHTML}
        </div>
      `;
    });
  }

  // شراء الشخصيات بالدين حتى لو الرصيد غير كافي
  function buySkinWithDebt(id, price) {
    totalCoins -= price; // ينزل دين بالسالب على الحساب
    unlockedSkins.push(id);
    currentSkinId = id;
    updateUI();
    renderShopItems();
  }

  function selectSkin(id) {
    currentSkinId = id;
    updateUI();
    renderShopItems();
  }

  function startGame() {
    speed = 9.5; obstacles = []; coins = []; score = 0; frameCount = 0; currentLane = 1;
    player.x = lanes[1]; player.jumpY = 0; player.isJumping = false;
    
    document.getElementById("mainMenu").classList.add("hidden");
    document.getElementById("pauseBtn").classList.remove("hidden");
    isPlaying = true; isPaused = false;
    gameLoop();
  }

  function togglePause() {
    if (!isPlaying) return;
    isPaused = !isPaused;
    document.getElementById("pauseMenu").classList.toggle("hidden", !isPaused);
    if (!isPaused) gameLoop();
  }

  function resetToMenu() {
    isPlaying = false; isPaused = false;
    cancelAnimationFrame(animationId);
    document.getElementById("pauseMenu").classList.add("hidden");
    document.getElementById("pauseBtn").classList.add("hidden");
    document.getElementById("mainMenu").classList.remove("hidden");
    renderMenuHero();
  }

  function moveLeft() { if (isPlaying && !isPaused && currentLane > 0) currentLane--; }
  function moveRight() { if (isPlaying && !isPaused && currentLane < 2) currentLane++; }
  function jump() {
    if (isPlaying && !isPaused && !player.isJumping) {
      player.isJumping = true; player.jumpSpeed = -16;
    }
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") moveLeft();
    if (e.key === "ArrowRight") moveRight();
    if (e.key === "ArrowUp") jump();
  });

  let startX = 0, startY = 0;
  const touchArea = document.getElementById("touchArea");

  touchArea.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  }, { passive: true });

  touchArea.addEventListener("touchend", (e) => {
    if (!startX || !startY) return;
    let diffX = e.changedTouches[0].clientX - startX;
    let diffY = e.changedTouches[0].clientY - startY;

    if (Math.abs(diffX) > Math.abs(diffY)) {
      if (diffX > 15) moveRight();
      else if (diffX < -15) moveLeft();
    } else {
      if (diffY < -15) jump();
    }
    startX = 0; startY = 0;
  }, { passive: true });

  function update() {
    speed += 0.0035;
    runCycle++;

    player.x += (lanes[currentLane] - player.x) * 0.25;
    if (player.isJumping) {
      player.jumpY += player.jumpSpeed;
      player.jumpSpeed += 0.9;
      if (player.jumpY >= 0) { player.jumpY = 0; player.isJumping = false; }
    }

    frameCount++;
    if (frameCount % 24 === 0) {
      const lane = Math.floor(Math.random() * 3);
      if (Math.random() > 0.35) {
        obstacles.push({ x: lanes[lane], y: -80, w: 45, h: 50 });
      } else {
        coins.push({ x: lanes[lane], y: -30, r: 12 });
      }
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      let o = obstacles[i]; o.y += speed;
      if (Math.abs(o.x - player.x) < 35 && o.y + o.h > player.y + player.jumpY && o.y < player.y + player.jumpY + 50) {
        if (player.jumpY > -15) {
          alert(`اصطدمت بالرصاص! مجموع النقاط: ${score}`);
          resetToMenu();
          return;
        }
      }
      if (o.y > canvas.height) obstacles.splice(i, 1);
    }

    // تسديد الديون تلقائياً عند جمع العملات
    for (let i = coins.length - 1; i >= 0; i--) {
      let c = coins[i]; c.y += speed;
      if (Math.abs(c.x - player.x) < 30 && Math.abs(c.y - (player.y + player.jumpY)) < 40) {
        score += 20; 
        totalCoins += 1; // يزيد الرصيد ويسدد الدين بالسالب
        updateUI();
        coins.splice(i, 1);
      } else if (c.y > canvas.height) coins.splice(i, 1);
    }
  }

  function draw() {
    // بيئة طريق واقعية ثنائية التدرج
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(245, 158, 11, 0.4)";
    ctx.lineWidth = 4;
    ctx.setLineDash([25, 20]);
    ctx.beginPath(); 
    ctx.moveTo(130, 0); ctx.lineTo(130, canvas.height); 
    ctx.moveTo(250, 0); ctx.lineTo(250, canvas.height); 
    ctx.stroke(); ctx.setLineDash([]);

    // رسم الرصاص التكتيكي
    obstacles.forEach(o => {
      ctx.fillStyle = "#ef4444";
      ctx.beginPath(); ctx.arc(o.x, o.y + 20, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fef08a";
      ctx.fillRect(o.x - 10, o.y + 10, 20, 30);
    });

    // رسم الكوينز الذهبية
    ctx.fillStyle = "#fbbf24";
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    coins.forEach(c => { 
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });

    // رسم ALPHA المنظوري المجسم (3D Realistic Runner)
    drawRealisticRunningAlpha3D(ctx, player.x, player.y + player.jumpY, runCycle, player.isJumping, getActiveSkin());
  }

  function gameLoop() {
    if (isPlaying && !isPaused) {
      update(); draw();
      animationId = requestAnimationFrame(gameLoop);
    }
  }

  updateUI();
  renderMenuHero();
</script>
</body>
</html>
