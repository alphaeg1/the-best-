<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم DBABA - برجر على أصوله</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* التنسيقات العامة والألوان النيون الفاخرة */
        :root {
            --orange-neon: #FF6B00;
            --orange-glow: rgba(255, 107, 0, 0.6);
            --bg-black: #0B0B0B;
            --card-bg: #141414;
            --text-white: #FFFFFF;
            --text-gray: #A0A0A0;
            --whatsapp-color: #25D366;
            --phone-color: #00E676;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            overflow-x: hidden;
        }

        /* الهيدر واللوجو النيون */
        header {
            background-color: rgba(11, 11, 11, 0.95);
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 107, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .restaurant-name {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-white);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .restaurant-name span {
            color: var(--orange-neon);
            text-shadow: 0 0 15px var(--orange-neon), 0 0 30px var(--orange-neon);
            animation: neon-flicker 2s infinite alternate;
        }

        .logo-img {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--orange-neon);
            box-shadow: 0 0 15px var(--orange-glow);
            transition: transform 0.4s ease;
        }

        .logo-img:hover {
            transform: rotate(360deg) scale(1.05);
        }

        /* زر الاتصال المباشر ف الهيدر */
        .call-header-btn {
            background: linear-gradient(45deg, var(--orange-neon), #FF3D00);
            color: var(--text-white);
            padding: 10px 22px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px var(--orange-glow);
            transition: all 0.3s ease;
            animation: pulse-glow 2s infinite;
        }

        .call-header-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--orange-neon);
        }

        /* Hero Banner مع الحركة الديناميكية */
        .hero-banner {
            width: 100%;
            height: 520px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            animation: slow-zoom 20s infinite alternate;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(11,11,11,0.6) 0%, rgba(11,11,11,0.9) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: var(--text-white);
            padding: 0 20px;
            animation: fadeInUp 1.2s ease-out;
        }

        .hero-content h1 {
            font-size: 52px;
            font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 107, 0, 0.8), 0 0 40px rgba(0,0,0,0.9);
            color: var(--text-white);
        }

        .hero-content p {
            font-size: 22px;
            color: var(--text-gray);
            letter-spacing: 1px;
        }

        /* قسم المنيو والطلبات */
        .links-section {
            padding: 70px 5%;
            text-align: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0b0b0b 100%);
            position: relative;
        }

        .section-title {
            font-size: 26px;
            max-width: 800px;
            margin: 0 auto 35px auto;
            line-height: 1.6;
            color: #E0E0E0;
            animation: fadeInUp 1.5s ease-out;
        }

        .action-cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 40px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 40px;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* زر المنيو النيون */
        .btn-menu {
            background-color: transparent;
            color: var(--orange-neon);
            border: 2px solid var(--orange-neon);
            box-shadow: 0 0 15px var(--orange-glow), inset 0 0 15px var(--orange-glow);
            text-shadow: 0 0 8px var(--orange-glow);
        }

        .btn-menu:hover {
            background-color: var(--orange-neon);
            color: var(--text-white);
            box-shadow: 0 0 30px var(--orange-neon), 0 0 50px var(--orange-neon);
            transform: translateY(-5px);
        }

        /* زر الاتصال الهاتفي */
        .btn-call {
            background-color: transparent;
            color: var(--phone-color);
            border: 2px solid var(--phone-color);
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4), inset 0 0 15px rgba(0, 230, 118, 0.4);
            text-shadow: 0 0 8px rgba(0, 230, 118, 0.4);
        }

        .btn-call:hover {
            background-color: var(--phone-color);
            color: var(--bg-black);
            box-shadow: 0 0 30px var(--phone-color);
            transform: translateY(-5px);
        }

        /* الفوتر الفاخر */
        footer {
            background-color: #050505;
            color: var(--text-white);
            padding: 50px 5% 30px 5%;
            text-align: center;
            border-top: 1px solid rgba(255, 107, 0, 0.3);
            box-shadow: 0 -10px 25px rgba(255, 107, 0, 0.05);
        }

        .footer-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .address-box {
            font-size: 19px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid #222;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .address-box i {
            color: var(--orange-neon);
            text-shadow: 0 0 10px var(--orange-neon);
        }

        /* أيقونات السوشيال ميديا بتأثيرات النيون */
        .social-links {
            display: flex;
            gap: 25px;
        }

        .social-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: var(--card-bg);
            color: var(--text-white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            text-decoration: none;
            border: 1px solid #333;
            transition: all 0.4s ease;
        }

        .social-icon.whatsapp:hover {
            background-color: var(--whatsapp-color);
            border-color: var(--whatsapp-color);
            box-shadow: 0 0 20px var(--whatsapp-color);
            transform: translateY(-5px) rotate(10deg);
        }

        .social-icon.facebook:hover {
            background-color: #1877F2;
            border-color: #1877F2;
            box-shadow: 0 0 20px #1877F2;
            transform: translateY(-5px) rotate(-10deg);
        }

        .social-icon.phone:hover {
            background-color: var(--phone-color);
            border-color: var(--phone-color);
            box-shadow: 0 0 20px var(--phone-color);
            color: var(--bg-black);
            transform: translateY(-5px) rotate(10deg);
        }

        /* زر طلب موقع بالفوتر */
        .btn-request-web {
            background: transparent;
            color: var(--text-white);
            border: 1px solid #444;
            font-size: 15px;
            padding: 12px 28px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .btn-request-web:hover {
            border-color: var(--orange-neon);
            color: var(--orange-neon);
            box-shadow: 0 0 15px var(--orange-glow);
        }

        .copyright {
            font-size: 14px;
            color: #555;
            width: 100%;
            border-top: 1px solid #1a1a1a;
            padding-top: 25px;
            margin-top: 10px;
        }

        /* Animations التأثيرات الحركية */
        @keyframes slow-zoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px var(--orange-glow); }
            50% { box-shadow: 0 0 25px var(--orange-neon); }
            100% { box-shadow: 0 0 10px var(--orange-glow); }
        }

        @keyframes neon-flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        /* تجاوب الشاشات الصغيرة */
        @media (max-width: 768px) {
            header { padding: 12px 4%; }
            .restaurant-name { font-size: 24px; }
            .hero-banner { height: 380px; }
            .hero-content h1 { font-size: 34px; }
            .hero-content p { font-size: 18px; }
            .section-title { font-size: 20px; }
            .btn { width: 100%; max-width: 320px; font-size: 18px; }
            .call-header-btn span { display: none; } /* إخفاء نص الإتصال في الهيدر في الموبايل للحفاظ على الشكل */
            .call-header-btn { padding: 10px; border-radius: 50%; }
        }
    </style>
</head>
