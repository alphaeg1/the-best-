<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MR:MILLO - Cafe</title>
  <!-- أيكونات Font Awesome للاتصال والبريد ومواقع التواصل -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      color: #333;
    }

    .card-container {
      width: 100%;
      max-width: 430px; /* حجم يتناسب مع شاشات الموبايل */
      background-color: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      position: relative;
      padding-bottom: 30px;
    }

    /* صورة الغلاف / خلفية المكان من فوق */
    .hero-banner {
      width: 100%;
      height: 220px;
      background-image: url('place-cover.jpg'); /* حط رابط صورة المكان هنا */
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* اللوجو في المربع الأسود */
    .logo-box {
      width: 110px;
      height: 110px;
      background-color: #000000;
      border-radius: 18px;
      position: absolute;
      bottom: -40px;
      left: 20px; /* موقعه على اليسار مثل الصورة */
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      border: 3px solid #ffffff;
    }

    .logo-box img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }

    /* محتوى الملف الشخصي */
    .profile-content {
      padding: 55px 20px 20px 20px;
    }

    .title {
      color: #2b6cb0;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 20px;
      font-weight: 700;
      color: #1a202c;
      line-height: 1.4;
      margin-bottom: 25px;
    }

    .section-label {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 15px;
    }

    /* أزرار السوشيال ميديا */
    .social-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .social-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px 5px;
      border-radius: 16px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .social-btn:hover {
      transform: translateY(-3px);
    }

    .social-btn i {
      font-size: 28px;
      margin-bottom: 6px;
    }

    /* ألوان الأزرار المخصصة */
    .btn-instagram {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }

    .btn-tiktok {
      background-color: #000000;
    }

    .btn-whatsapp {
      background-color: #25d366;
    }

    /* كروت الاتصال والبيانات */
    .info-card {
      background-color: #f7fafc;
      border: 1px solid #edf2f7;
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .info-icon {
      width: 45px;
      height: 45px;
      background-color: #edf2f7;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-left: 15px;
      font-size: 18px;
      color: #2d3748;
    }

    .info-details {
      display: flex;
      flex-direction: column;
    }

    .info-value {
      font-size: 17px;
      font-weight: 700;
      color: #1a202c;
      direction: ltr;
      text-align: right;
    }

    .info-label {
      font-size: 12px;
      color: #718096;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- 1. صورة المكان (الخلفية من فوق) -->
    <div class="hero-banner">
      <!-- 2. اللوجو في المربع الأسود -->
      <div class="logo-box">
        <img src="WhatsApp Image‏ 2026-07-26 at 21.11.02 (1).jpeg" alt="MR:MILLO Logo"> <!-- حط صورة اللوجو هنا -->
      </div>
    </div>

    <div class="profile-content">
      <!-- اسم الكافيه -->
      <h1 class="title">MR:MILLO</h1>
      
      <!-- الوصف / السلوجان -->
      <p class="tagline">بنختلف عن غيرنا كتير و بنساعدك تكون مختلف</p>

      <div class="section-label">تابعونا على</div>

      <!-- أزرار التواصل الاجتماعي -->
      <div class="social-grid">
        <!-- لينك انستجرام -->
        <a href="https://instagram.com/fake_account" target="_blank" class="social-btn btn-instagram">
          <i class="fa-brands fa-instagram"></i>
          <span>instagram</span>
        </a>

        <!-- لينك تيك توك -->
        <a href="https://tiktok.com/@fake_account" target="_blank" class="social-btn btn-tiktok">
          <i class="fa-brands fa-tiktok"></i>
          <span>tiktok</span>
        </a>

        <!-- لينك واتساب -->
        <a href="https://wa.me/201000000000" target="_blank" class="social-btn btn-whatsapp">
          <i class="fa-brands fa-whatsapp"></i>
          <span>whatsapp</span>
        </a>
      </div>

      <!-- كارت رقم الهاتف (لينك اتصال مباشر) -->
      <a href="tel:01000000000" class="info-card">
        <div class="info-icon">
          <i class="fa-solid fa-phone"></i>
        </div>
        <div class="info-details">
          <span class="info-value">01000000000</span>
          <span class="info-label">رقم الهاتف</span>
        </div>
      </a>

      <!-- كارت البريد الإلكتروني (لينك إيميل مباشر) -->
      <a href="mailto:mrmillo.cafe@example.com" class="info-card">
        <div class="info-icon">
          <i class="fa-solid fa-envelope"></i>
        </div>
        <div class="info-details">
          <span class="info-value">mrmillo.cafe@example.com</span>
          <span class="info-label">البريد الإلكتروني</span>
        </div>
      </a>

    </div>

  </div>

</body>
</html>
