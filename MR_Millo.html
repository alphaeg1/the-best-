<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسم الكافيه</title>
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0d0f12; /* أسود فاخر مائل للفحمي */
            --card-bg: #161920; /* رمادي داكن جداً للكروت */
            --card-border: #2a2f3d; /* حدود رفيعة وأنيقة */
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --accent-glow: rgba(255, 255, 255, 0.08);
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1e2330 0%, var(--bg-body) 70%);
        }

        /* الهيدر المحسّن */
        header {
            background-color: rgba(22, 25, 32, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 14px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* اللوجو المدور */
        .logo-container {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #3b4252;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
            background-color: #1a1e26;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* شارة حالة الكافيه */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #1a1e26;
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .status-dot.open {
            background-color: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
            animation: pulse 1.6s infinite;
        }

        .status-dot.closed {
            background-color: var(--accent-red);
            box-shadow: 0 0 12px var(--accent-red);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* القسم الرئيسي */
        .hero {
            padding: 60px 5% 30px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 12px;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.15rem;
        }

        /* قسم الكروت */
        .info-section {
            padding: 20px 5%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .info-card {
            flex: 1;
            background-color: var(--card-bg);
            padding: 28px 18px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .info-card:hover {
            transform: translateY(-7px);
            border-color: #475569;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow);
        }

        .info-card i.card-icon {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff, #64748b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-card h3 {
            margin-bottom: 12px;
            font-size: 1.2rem;
            color: #ffffff;
        }

        .card-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 20px;
            background-color: #2a2f3d;
            color: #ffffff !important;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid #3b4252;
            transition: all 0.3s ease;
        }

        .card-btn:hover {
            background-color: #ffffff;
            color: #0d0f12 !important;
            border-color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        /* أزرار السوشيال ميديا */
        .social-section {
            text-align: center;
            margin: 40px 0 20px;
        }

        .social-section h4 {
            color: var(--text-muted);
            margin-bottom: 18px;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.25rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            transform: translateY(-4px) scale(1.05);
            color: #ffffff;
            border-color: transparent;
        }

        .social-icon.facebook:hover { background-color: #1877f2; box-shadow: 0 5px 20px rgba(24, 119, 242, 0.4); }
        .social-icon.whatsapp:hover { background-color: #25d366; box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4); }
        .social-icon.instagram:hover { background-color: #e4405f; box-shadow: 0 5px 20px rgba(228, 64, 95, 0.4); }

        /* الفوتر واللينك المطلوب */
        footer {
            margin-top: auto;
            background-color: var(--card-bg);
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid var(--card-border);
        }

        .promo-link {
            display: inline-block;
            margin-top: 14px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            color: #0d0f12;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .promo-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.3);
            background: #ffffff;
        }

        /* الاستجابة للهواتف الذكية الضيقة */
        @media (max-width: 640px) {
            .info-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="logo-container">
            <img src="WhatsApp Image‏ 2026-07-26 at 21.11.02 (1).jpeg" alt="لوجو الكافيه">
        </div>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">جاري التحقق...</span>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <section class="hero">
        <h1>مرحباً بكم في كافيهنا</h1>
        <p>تجربة استثنائية لأجود أنواع القهوة والمشروبات</p>
    </section>

    <!-- قسم الخدمات -->
    <section class="info-section">
        <div class="info-card">
            <i class="fa-solid fa-phone card-icon"></i>
            <h3>رقم الهاتف</h3>
            <p><a href="tel:+201000000000" class="card-btn">+20 100 000 0000</a></p>
        </div>

        <div class="info-card">
            <i class="fa-solid fa-location-dot card-icon"></i>
            <h3>موقعنا (اللوكيشن)</h3>
            <p><a href="https://maps.google.com" target="_blank" class="card-btn">عرض الخريطة</a></p>
        </div>

        <div class="info-card">
            <i class="fa-solid fa-bag-shopping card-icon"></i>
            <h3>اطلب اوردر</h3>
            <p><a href="https://wa.me/201000000000" target="_blank" class="card-btn">اطلب عبر الواتساب</a></p>
        </div>
    </section>

    <!-- أيقونات السوشيال ميديا -->
    <div class="social-section">
        <h4>تابعنا على مواقع التواصل</h4>
        <div class="social-links">
            <a href="https://facebook.com" target="_blank" class="social-icon facebook" title="فيسبوك">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://wa.me/201000000000" target="_blank" class="social-icon whatsapp" title="واتساب">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="https://instagram.com" target="_blank" class="social-icon instagram" title="إنستغرام">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
    </div>

    <!-- الفوتر -->
    <footer>
        <p style="color: var(--text-muted); font-size: 0.85rem;">جميع الحقوق محفوظة ©️ 2026</p>
        <a href="https://example.com" class="promo-link" target="_blank">لو عايز ويب سايت زي دي دوس هنا</a>
    </footer>

    <!-- جافاسكريبت للتحقق من أوقات العمل -->
    <script>
        function checkCafeStatus() {
            const now = new Date();
            const currentHour = now.getHours();

            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (currentHour >= 9 || currentHour < 1) {
                dot.className = "status-dot open";
                text.textContent = "مفتوح الآن";
            } else {
                dot.className = "status-dot closed";
                text.textContent = "مغلق الآن";
            }
        }

        checkCafeStatus();
        setInterval(checkCafeStatus, 60000);
    </script>

</body>
</html>
