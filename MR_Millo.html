<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسم الكافيه</title>
    <!-- خط تجوال من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* ميكس ألوان فاخر وقوي */
            --bg-dark: #0f0c20;
            --card-bg: rgba(25. 20, 50, 0.65);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary-accent: #10b981; /* زمردي جذاب */
            --purple-accent: #a855f7;  /* بنفسجي ساطع */
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
            --font-family: 'Tajawal', 'Segoe UI', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* خلفية ديناميكية متدرجة مع أضواء ناعمة */
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(168, 85, 247, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(16, 185, 129, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(15, 12, 32, 1) 0%, #070510 100%);
            background-attachment: fixed;
        }

        /* الهيدر المحسّن بخامة زجاجية */
        header {
            background-color: rgba(15, 12, 32, 0.75);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--card-border);
            padding: 12px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-container {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--purple-accent);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            background-color: #1a1e26;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
            font-size: 14px;
            font-weight: 700;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #64748b;
        }

        .status-dot.open {
            background-color: var(--primary-accent);
            box-shadow: 0 0 12px var(--primary-accent);
            animation: pulse 1.6s infinite;
        }

        .status-dot.closed {
            background-color: #ef4444;
            box-shadow: 0 0 12px #ef4444;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* القسم الرئيسي والخطوط المميزة */
        .hero {
            padding: 50px 5% 25px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 10px;
            /* نص بتدرج لوني ملفت */
            background: linear-gradient(135deg, #ffffff 30%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .hero p {
            color: var(--text-sub);
            font-size: 1.2rem;
            font-weight: 500;
        }

        /* الكروت الزجاجية Glassmorphism */
        .info-section {
            padding: 20px 5%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .info-card {
            flex: 1;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 28px 18px;
            border-radius: 24px;
            border: 1px solid var(--card-border);
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .info-card:hover {
            transform: translateY(-8px);
            border-color: var(--purple-accent);
            box-shadow: 0 20px 40px rgba(168, 85, 247, 0.2);
        }

        .info-card i.card-icon {
            font-size: 2.2rem;
            margin-bottom: 14px;
            background: linear-gradient(135deg, var(--primary-accent), #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-card h3 {
            margin-bottom: 12px;
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
        }

        /* أزرار متدرجة تفاعلية */
        .card-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 22px;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 100%);
            color: #ffffff !important;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }

        .card-btn:hover {
            background: linear-gradient(135deg, var(--primary-accent) 0%, #059669 100%);
            border-color: transparent;
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }

        /* أزرار السوشيال ميديا */
        .social-section {
            text-align: center;
            margin: 35px 0 20px;
        }

        .social-section h4 {
            color: var(--text-sub);
            margin-bottom: 18px;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.3rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            transform: translateY(-5px) scale(1.08);
            color: #ffffff;
            border-color: transparent;
        }

        .social-icon.facebook:hover { background-color: #1877f2; box-shadow: 0 5px 25px rgba(24, 119, 242, 0.5); }
        .social-icon.whatsapp:hover { background-color: #25d366; box-shadow: 0 5px 25px rgba(37, 211, 102, 0.5); }
        .social-icon.instagram:hover { background-color: #e4405f; box-shadow: 0 5px 25px rgba(228, 64, 95, 0.5); }

        /* الفوتر والزر الذهبي الساطع */
        footer {
            margin-top: auto;
            background: rgba(10, 8, 22, 0.8);
            text-align: center;
            padding: 28px 20px;
            border-top: 1px solid var(--card-border);
        }

        .promo-link {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: #ffffff;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
        }

        .promo-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.6);
            filter: brightness(1.1);
        }

        @media (max-width: 640px) {
            .info-section {
                flex-direction: column;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="logo-container">
            <img src="WhatsApp Image‏ 2026-07-26 at 21.11.02 (1).jpeg" alt="لوجو الكافيه">
        </div>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">جاري التحقق...</span>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <section class="hero">
        <h1>مرحباً بكم في كافيهنا</h1>
        <p>تجربة استثنائية لأجود أنواع القهوة والمشروبات</p>
    </section>

    <!-- قسم الخدمات -->
    <section class="info-section">
        <div class="info-card">
            <i class="fa-solid fa-phone card-icon"></i>
            <h3>رقم الهاتف</h3>
            <p><a href="tel:+201000000000" class="card-btn">+20 100 000 0000</a></p>
        </div>

        <div class="info-card">
            <i class="fa-solid fa-location-dot card-icon"></i>
            <h3>موقعنا (اللوكيشن)</h3>
            <p><a href="https://maps.google.com" target="_blank" class="card-btn">عرض الخريطة</a></p>
        </div>

        <div class="info-card">
            <i class="fa-solid fa-bag-shopping card-icon"></i>
            <h3>اطلب اوردر</h3>
            <p><a href="https://wa.me/201000000000" target="_blank" class="card-btn">اطلب عبر الواتساب</a></p>
        </div>
    </section>

    <!-- أيقونات السوشيال ميديا -->
    <div class="social-section">
        <h4>تابعنا على مواقع التواصل</h4>
        <div class="social-links">
            <a href="https://facebook.com" target="_blank" class="social-icon facebook" title="فيسبوك">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://wa.me/201000000000" target="_blank" class="social-icon whatsapp" title="واتساب">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="https://instagram.com" target="_blank" class="social-icon instagram" title="إنستغرام">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
    </div>

    <!-- الفوتر -->
    <footer>
        <p style="color: var(--text-sub); font-size: 0.85rem;">جميع الحقوق محفوظة ©️ 2026</p>
        <a href="https://example.com" class="promo-link" target="_blank">لو عايز ويب سايت زي دي دوس هنا</a>
    </footer>

    <!-- جافاسكريبت للتحقق من أوقات العمل -->
    <script>
        function checkCafeStatus() {
            const now = new Date();
            const currentHour = now.getHours();

            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (currentHour >= 9 || currentHour < 1) {
                dot.className = "status-dot open";
                text.textContent = "مفتوح الآن";
            } else {
                dot.className = "status-dot closed";
                text.textContent = "مغلق الآن";
            }
        }

        checkCafeStatus();
        setInterval(checkCafeStatus, 60000);
    </script>

</body>
</html>
