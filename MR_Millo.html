<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسم الكافيه</title>
    <!-- خط تجوال من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* بليتة أزرق غامق هادئ ومريح جداً للعين */
            --bg-dark: #0b1320;                             /* أزرق ليلي غامق جداً وناعم */
            --card-bg: rgba(19, 30, 49, 0.75);              /* كروت زجاجية داكنة بدرجة أزرق كحلي */
            --card-border: rgba(56, 189, 248, 0.15);        /* حدود سماوية هادئة وخفيفة */
            
            --primary-accent: #38bdf8;                    /* أزرق سماوي هادئ للتفاصيل */
            --secondary-accent: #60a5fa;                  /* أزرق فاتح مريح بالتفاعل */
            --emerald-accent: #10b981;                    /* زمردي هادئ لحالة (مفتوح) */
            
            --text-main: #f1f5f9;                         /* أبيض ثلجي مريح للعين */
            --text-sub: #94a3b8;                          /* أزرق رمادي هادئ للنصوص الثانوية */
            --font-family: 'Tajawal', 'Segoe UI', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* خلفية متدرجة بأضواء زرقاء كحلية هادئة جداً */
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(30, 58, 138, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, #0b1320 0%, #060a12 100%);
            background-attachment: fixed;
        }

        /* الهيدر المحسّن */
        header {
            background-color: rgba(11, 19, 32, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 12px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-container {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--primary-accent);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
            background-color: #131e31;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-sub);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #64748b;
        }

        .status-dot.open {
            background-color: var(--emerald-accent);
            box-shadow: 0 0 10px var(--emerald-accent);
            animation: pulse 2s infinite;
        }

        .status-dot.closed {
            background-color: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* القسم الرئيسي */
        .hero {
            padding: 50px 5% 25px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 12px;
            /* تدرج هادئ من الأبيض للسماوي الناعم */
            background: linear-gradient(135deg, #ffffff 40%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .hero p {
            color: var(--text-sub);
            font-size: 1.15rem;
            font-weight: 500;
        }

        /* الكروت الزجاجية */
        .info-section {
            padding: 20px 5%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .info-card {
            flex: 1;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 28px 18px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .info-card:hover {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.12);
        }

        .info-card i.card-icon {
            font-size: 2rem;
            margin-bottom: 14px;
            color: var(--primary-accent);
        }

        .info-card h3 {
            margin-bottom: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* الأزرار */
        .card-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 22px;
            background: rgba(56, 189, 248, 0.08);
            color: #e0f2fe !important;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid rgba(56, 189, 248, 0.25);
            transition: all 0.3s ease;
        }

        .card-btn:hover {
            background: #0284c7;
            color: #ffffff !important;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
        }

        /* السوشيال ميديا */
        .social-section {
            text-align: center;
            margin: 35px 0 20px;
        }

        .social-section h4 {
            color: var(--text-sub);
            margin-bottom: 18px;
            font-size: 1rem;
            font-weight: 600;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size: 1.2rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            transform: translateY(-4px);
            color: #ffffff;
            border-color: transparent;
        }

        .social-icon.facebook:hover { background-color: #1877f2; box-shadow: 0 4px 20px rgba(24, 119, 242, 0.35); }
        .social-icon.whatsapp:hover { background-color: #25d366; box-shadow: 0 4px 20px rgba(37, 211, 102, 0.35); }
        .social-icon.instagram:hover { background-color: #e4405f; box-shadow: 0 4px 20px rgba(228, 64, 95, 0.35); }

        /* الفوتر */
        footer {
            margin-top: auto;
            background: #060a12;
            text-align: center;
            padding: 28px 20px;
            border-top: 1px solid var(--card-border);
        }

        .promo-link {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #ffffff;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            transition: all 0.3s ease;
        }

        .promo-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
            filter: brightness(1.1);
        }

        @media (max-width: 640px) {
            .info-section {
                flex-direction: column;
            }
            .hero h1 {
                font-size: 2.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="logo-container">
            <img src="WhatsApp Image‏ 2026-07-26 at 21.11.02 (1).jpeg" alt="لوجو الكافيه">
        </div>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">جاري التحقق...</span>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <section class="hero">
        <h1>مرحباً بكم في كافيهنا</h1>
        <p>تجربة استثنائية لأجود أنواع القهوة والمشروبات</p>
    </section>

    <!-- قسم الخدمات -->
    <section class="info-section">
        <div class="info-card">
            <i class="fa-solid fa-phone card-icon"></i>
            <h3>رقم الهاتف</h3>
            <p><a href="tel:+201000000000" class="card-btn">+20 100 000 0000</a></p>
        </div>

        <div class="info-card">
            <i class="fa-solid fa-location-dot card-icon"></i>
            <h3>موقعنا (اللوكيشن)</h3>
            <p><a href="https://maps.google.com" target="_blank" rel="noopener noreferrer" class="card-btn">عرض الخريطة</a></p>
        </div>

        <div class="info-card">
            <i class="fa-solid fa-bag-shopping card-icon"></i>
            <h3>اطلب اوردر</h3>
            <p><a href="https://wa.me/201000000000" target="_blank" rel="noopener noreferrer" class="card-btn">اطلب عبر الواتساب</a></p>
        </div>
    </section>

    <!-- أيقونات السوشيال ميديا -->
    <div class="social-section">
        <h4>تابعنا على مواقع التواصل</h4>
        <div class="social-links">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="social-icon facebook" title="فيسبوك">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://wa.me/201000000000" target="_blank" rel="noopener noreferrer" class="social-icon whatsapp" title="واتساب">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-icon instagram" title="إنستغرام">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
    </div>

    <!-- الفوتر -->
    <footer>
        <p style="color: var(--text-sub); font-size: 0.85rem;">جميع الحقوق محفوظة ©️ 2026</p>
        <a href="https://example.com" class="promo-link" target="_blank" rel="noopener noreferrer">لو عايز ويب سايت زي دي دوس هنا</a>
    </footer>

    <!-- جافاسكريبت للتحقق من أوقات العمل -->
    <script>
        function checkCafeStatus() {
            const now = new Date();
            const currentHour = now.getHours();

            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (!dot || !text) return;

            if (currentHour >= 9 || currentHour < 1) {
                dot.className = "status-dot open";
                text.textContent = "مفتوح الآن";
            } else {
                dot.className = "status-dot closed";
                text.textContent = "مغلق الآن";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkCafeStatus();
            setInterval(checkCafeStatus, 60000);
        });
    </script>

</body>
</html>
