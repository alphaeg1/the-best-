<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسم الكافيه</title>
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-shadow: rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* الهيدر المحسّن */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px var(--accent-shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* اللوجو المدور */
        .logo-container {
            width: 65px;
            height: 65px;
            border-radius: 50%; /* إطار مدور */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border-color);
            background-color: #f1f5f9;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* شارة حالة الكافيه */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #f1f5f9;
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 700;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .status-dot.open {
            background-color: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
            animation: pulse 1.6s infinite;
        }

        .status-dot.closed {
            background-color: var(--accent-red);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* القسم الرئيسي */
        .hero {
            padding: 60px 5% 30px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 12px;
            color: #0f172a;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.15rem;
        }

        /* قسم الكروت (جنب بعض) */
        .info-section {
            padding: 20px 5%;
            display: flex; /* لترتيب الكروت أفقياً بجانب بعضها */
            flex-direction: row;
            justify-content: center;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .info-card {
            flex: 1; /* توزيع المساحة بالتساوي بين الكروت الثلاثة */
            background-color: var(--card-bg);
            padding: 25px 15px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 4px 20px var(--accent-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .info-card i.card-icon {
            font-size: 1.8rem;
            color: #334155;
            margin-bottom: 12px;
        }

        .info-card h3 {
            margin-bottom: 8px;
            font-size: 1.15rem;
            color: #0f172a;
        }

        .info-card p, .info-card a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .card-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 16px;
            background-color: #f1f5f9;
            color: #0f172a !important;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .card-btn:hover {
            background-color: #e2e8f0;
        }

        /* أزرار السوشيال ميديا */
        .social-section {
            text-align: center;
            margin: 30px 0;
        }

        .social-section h4 {
            color: var(--text-muted);
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #334155;
            font-size: 1.2rem;
            text-decoration: none;
            box-shadow: 0 4px 10px var(--accent-shadow);
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            transform: scale(1.1);
            color: #ffffff;
            border-color: transparent;
        }

        .social-icon.facebook:hover { background-color: #1877f2; }
        .social-icon.whatsapp:hover { background-color: #25d366; }
        .social-icon.instagram:hover { background-color: #e4405f; }

        /* الفوتر واللينك المطلوب */
        footer {
            margin-top: auto;
            background-color: var(--card-bg);
            text-align: center;
            padding: 25px 20px;
            border-top: 1px solid var(--border-color);
        }

        .promo-link {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 24px;
            background-color: #0f172a;
            color: #ffffff;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.15);
            transition: all 0.3s ease;
        }

        .promo-link:hover {
            background-color: #334155;
            transform: translateY(-2px);
        }

        /* الاستجابة للهواتف الذكية الضيقة */
        @media (max-width: 640px) {
            .info-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="logo-container">
            <img src="WhatsApp Audio‏ 2026-07-25 at 17.32.29.opus" alt="لوجو الكافيه">
        </div>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">جاري التحقق...</span>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <section class="hero">
        <h1>مرحباً بكم في كافيهنا</h1>
        <p>تجربة استثنائية لأجود أنواع القهوة والمشروبات</p>
    </section>

    <!-- قسم الخدمات (الكروت جمب بعض) -->
    <section class="info-section">
        <div class="info-card">
            <i class="fa-solid fa-phone card-icon"></i>
            <h3>رقم الهاتف</h3>
            <p><a href="tel:+201000000000" class="card-btn">+20 100 000 0000</a></p>
        </div>

        <div class="info-card">
            <i class="fa-solid fa-location-dot card-icon"></i>
            <h3>موقعنا (اللوكيشن)</h3>
            <p><a href="https://maps.google.com" target="_blank" class="card-btn">عرض الخريطة</a></p>
        </div>

        <div class="info-card">
            <i class="fa-solid fa-bag-shopping card-icon"></i>
            <h3>اطلب اوردر</h3>
            <p><a href="https://wa.me/201000000000" target="_blank" class="card-btn">اطلب عبر الواتساب</a></p>
        </div>
    </section>

    <!-- أيقونات السوشيال ميديا -->
    <div class="social-section">
        <h4>تابعنا على مواقع التواصل</h4>
        <div class="social-links">
            <a href="https://facebook.com" target="_blank" class="social-icon facebook" title="فيسبوك">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://wa.me/201000000000" target="_blank" class="social-icon whatsapp" title="واتساب">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="https://instagram.com" target="_blank" class="social-icon instagram" title="إنستغرام">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
    </div>

    <!-- الفوتر -->
    <footer>
        <p style="color: var(--text-muted); font-size: 0.85rem;">جميع الحقوق محفوظة ©️ 2026</p>
        <a href="https://example.com" class="promo-link" target="_blank">لو عايز ويب سايت زي دي دوس هنا</a>
    </footer>

    <!-- جافاسكريبت للتحقق من أوقات العمل -->
    <script>
        function checkCafeStatus() {
            const now = new Date();
            const currentHour = now.getHours();

            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            // مفتوح من 9 صباحاً (9) وحتى 1 صباحاً (1 ليلاً)
            if (currentHour >= 9 || currentHour < 1) {
                dot.className = "status-dot open";
                text.textContent = "مفتوح الآن";
            } else {
                dot.className = "status-dot closed";
                text.textContent = "مغلق الآن";
            }
        }

        checkCafeStatus();
        setInterval(checkCafeStatus, 60000);
    </script>

</body>
</html>
